<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- A pixel N on a matte ground, with one holographic pip. Printstream
       palette: #141313 ground, #e5e2e1 mark, #d9bcff pip. Eight cells wide
       on purpose — at 16x16 each cell is 2px, so nothing blurs. -->
  <rect width="8" height="8" fill="#141313"/>
  <rect x="1" y="1" width="1" height="6" fill="#e5e2e1"/>
  <rect x="5" y="1" width="1" height="6" fill="#e5e2e1"/>
  <rect x="2" y="2" width="1" height="2" fill="#e5e2e1"/>
  <rect x="3" y="3" width="1" height="2" fill="#e5e2e1"/>
  <rect x="4" y="4" width="1" height="2" fill="#e5e2e1"/>
  <rect x="6" y="6" width="1" height="1" fill="#d9bcff"/>
</svg>
